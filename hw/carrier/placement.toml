# SPDX-License-Identifier: CERN-OHL-S-2.0
# The carrier floorplan: x, y in mm from the card's front-top corner (x toward the
# rear, y downward), rot in degrees. J1 (the fingers) is placed from slotgeom, not here.
#
# Plan 1b, task 4: every translator sits above its own fingers so the slot nets stay short
# (the load gate wants <= 15 pF a pin), bottom to top:
#   row 1 (nearest the fingers): the data translator U1 (74LVCR2245A) over D0-D7 at the
#     front, the address translator U2 over A0..A15, the clock 2G17s U6/U7 over 7M, Q3, PH1,
#     PH0, the R/W 1T45 U3, the open-drain 1G07s U8-U13 over /IRQ, /NMI, /INH, /DMA, RDY and
#     /RESET. Both translators face their slot side to the fingers and their bit pins ascend
#     with the fingers. The lane below each row (2-5 mm) carries the A0-A15 copper on F.Cu.
#   row 2: the listen '541 U4 over U1 (its D0..D7 inputs run on B.Cu, where the data fingers
#     are), the control '541 U5 over the select fingers, and the 1G07s whose fingers are on
#     the top side (RDY, /DMA).
#   power at the rear: F1, D1 by the +5V / GND fingers; VR1 and its capacitors at the front,
#     where the module's 5V pins are.
# J2 (the module socket) lies above, 3 mm clear of row 2 (a courtyard to courtyard gap
# >= 3 mm between every pair of rows), with the headers over the module's far edge. J2 is rot
# 0, so the module lies over the empty band above it, where nothing tall may go (the
# silkscreen art goes there). Everything is on F (single-sided assembly).
#
# [decouple] maps each decoupling cap to the IC supply pin(s) it serves; the tests check
# each is within 2 mm (pad edge to pad edge).

