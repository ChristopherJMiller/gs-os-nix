# Pin capacitance of every IC that sits on an Apple II slot (J1) net, for hw-load
# (hw/tools/check_load.py). Keyed by the part VALUE as it appears in the netlist.
#
# Each part lists, by package pin number, the pins that may be on a J1 net:
#   in_pins   input-only pins, at ci (pF)
#   io_pins   bidirectional pins, at cio (pF)
#   od_pins   open-drain outputs that drive a slot line by design, at co (pF)
# A pin on a J1 net that is in none of the three lists fails the gate, naming it: a push-pull
# buffer output on a slot net is a design error, not a load to count. Likewise a part value
# missing from this file.
#
#   basis     "typ" or "max": which column of the datasheet the figures come from. TI prints
#             these capacitances only as typical values (VCC = 3.3 V, TA = 25 C) and gives no
#             maximum, so every entry here is "typ". Apple's 15 pF limit is a design limit,
#             and the 0.10 pF/mm copper figure is itself an estimate.
#   url, table  the datasheet and the table in it
#
# Apple's other limit, two LS loads, is not gated: an LVC/ALVC input draws about 1 uA, against
# an LS load's 0.4 mA IIL / 20 uA IIH, so the pF limit is the binding one.

# --- copper and vias (4 layers, plan 1b amendment 2026-10-31) -----------------------------
# check_load.py turns these into the copper pF/mm and the pF per via. The stackup is JLCPCB
# JLC04161H-7628, 1.6 mm: F.Cu, a 7628 prepreg of 0.2104 mm (er 4.4), In1.Cu (GND), a
# 1.065 mm core, In2.Cu (+3V3), the same prepreg, B.Cu. build_board.STACKUP writes the same
# numbers into the board file.

[stackup]
er = 4.4                    # 7628 prepreg
prepreg_mm = 0.2104         # outer copper to the nearest inner plane
board_mm = 1.6
copper_mm = 0.035           # 1 oz outer copper
trace_mm = 0.15             # the signal track width
source = "gsuberland/jlcpcb_autogenerated_stackups (JLC04161H-7628); biergaizi's JLCPCB stackup gist; JITX jlcpcb materials (er 4.4 for 7628)"

[via]
pad_mm = 0.6                # D1: the via's pad (build_board.VIA_MM)
antipad_mm = 1.0            # D2: pad + 2 x the planes' 0.2 mm clearance (build_board.INNER_CLEARANCE_MM)
source = "H. Johnson, High-Speed Digital Design, via capacitance C = 1.41 er T D1 / (D2 - D1) pF (inches), T = board thickness; D1 pad, D2 plane antipad"

[parts."SN74LVCR2245A"]
ci = 4.0
cio = 5.5
in_pins = [1, 19]                                   # DIR, /OE
io_pins = [2, 3, 4, 5, 6, 7, 8, 9, 11, 12, 13, 14, 15, 16, 17, 18]
basis = "typ"
url = "https://www.ti.com/lit/ds/symlink/sn74lvcr2245a.pdf"
table = "SCAS581N, 7.5 Electrical Characteristics: Ci (control inputs) 4 pF, Cio (A or B port) 5.5 pF, VCC 3.3 V"

[parts."74ALVC164245"]
ci = 6.5
cio = 8.5
in_pins = [1, 24, 25, 48]                           # 1DIR, 2OE, 2DIR, 1OE
# the slot-side data pins (the ones on J1 nets); the FPGA-side pins are on no J1 net
io_pins = [2, 3, 5, 6, 8, 9, 11, 12, 13, 14, 16, 17, 19, 20, 22, 23]
basis = "typ"
url = "https://www.ti.com/lit/ds/symlink/sn74alvc164245.pdf"
table = "SCAS416Q, 6.6 Electrical Characteristics, VCCA = 2.7 V to 3.6 V: Ci (control inputs) 6.5 pF, Cio (A or B port) 8.5 pF"

[parts."SN74LVC1T45"]
ci = 2.5
cio = 6.0
in_pins = [5]                                       # DIR
io_pins = [3, 4]
basis = "typ"
url = "https://www.ti.com/lit/ds/symlink/sn74lvc1t45.pdf"
table = "SCES515N, 5.5 Electrical Characteristics: Ci (DIR) 2.5 pF, Cio (A or B port) 6 pF, VCCA = VCCB = 3.3 V, TA = 25 C"

[parts."74LVC541"]
ci = 4.0
in_pins = [1, 2, 3, 4, 5, 6, 7, 8, 9, 19]           # /OE1, A1..A8, /OE2; the Y outputs 11-18 never face the slot
basis = "typ"
url = "https://www.ti.com/lit/ds/symlink/sn74lvc541a.pdf"
table = "SCAS298O, 5.5 Electrical Characteristics: Ci 4 pF, VCC 3.3 V"

[parts."74LVC2G17"]
ci = 4.0
in_pins = [1, 3]                                    # 1A, 2A; the 1Y and 2Y outputs face the FPGA
basis = "typ"
url = "https://www.ti.com/lit/ds/symlink/sn74lvc2g17.pdf"
table = "SCES381N, 7.5 Electrical Characteristics: Ci 4 pF at VCC 3.3 V"

[parts."74LVC1G07"]
ci = 4.0
co = 5.0
in_pins = [2]                                       # A
od_pins = [4]                                       # Y, open drain: pulls the slot line low by design
basis = "typ"
url = "https://www.ti.com/lit/ds/symlink/sn74lvc1g07.pdf"
table = "SCES296AG, 5.5 Electrical Characteristics: Ci 4 pF (A), Co 5 pF (Y, open drain), VCC 3.3 V"
