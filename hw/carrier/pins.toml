#
# carrier_top's port -> ball assignment (rtl/board/carrier_top.v), for the LFE5U-25F on
# the iCESugar-Pro module. The LPF is generated from this file. hw-pinmap checks that every
# ball is a PIO in a 3.3 V bank, that each ball is on a SODIMM pin (hw/carrier/
# icesugar_pro_v1_3.toml), and that the netlist carries the port's net on that pin.
#
# Generated by hw/tools/plan_buses.py for the placement in hw/carrier/placement.toml: every
# bus is a river (its pads along J2 in the order of its pins on its translator, on the J2 row
# its route reaches), with the least lateral travel; hw/tools/bus_route.py lays it. Do not
# hand-edit: rerun `python3 hw/tools/plan_buses.py --write` after the placement changes, then
# `just -f hw/justfile board`. A test checks that this file is the plan.
# Every bank is 3.3 V (the module powers VCCIO from 3V3), so the bank does not constrain it.

part = "LFE5U-25F-6BG256C"
io_standard = "LVCMOS33"

[ports.clk25]
dir = "in"
on_module = true
balls = ["P6"]

[ports.slot_a]
dir = "in"
# SODIMM pins 49 51 57 59 61 63 65 67 69 71 73 75 77 79 81 83
balls = ["B8", "A7", "B7", "A6", "B6", "A5", "B5", "A4", "B4", "A3", "B3", "A2", "B1", "B2", "C1", "C2"]

[ports.slot_rw]
dir = "in"
balls = ["D4"]   # pin 132

[ports.slot_d]
dir = "inout"
# SODIMM pins 62 64 66 68 70 72 74 76
balls = ["L13", "K14", "K13", "J14", "J13", "H14", "H13", "G14"]

[ports.slot_dl]
dir = "in"
# SODIMM pins 42 44 46 48 50 52 54 58
balls = ["P11", "P12", "N12", "P13", "N13", "P14", "M12", "M13"]

[ports.slot_ph0]
dir = "in"
balls = ["D3"]   # pin 87

[ports.slot_ph1]
dir = "in"
balls = ["G1"]   # pin 97

[ports.slot_q3]
dir = "in"
balls = ["C10"]   # pin 102

[ports.slot_7m]
dir = "in"
balls = ["C8"]   # pin 114

[ports.slot_devsel_n]
dir = "in"
balls = ["J2"]   # pin 109

[ports.slot_iosel_n]
dir = "in"
balls = ["J1"]   # pin 103

[ports.slot_iostrb_n]
dir = "in"
balls = ["L2"]   # pin 117

[ports.slot_m2sel_n]
dir = "in"
balls = ["K1"]   # pin 111

[ports.slot_m2b0]
dir = "in"
balls = ["K2"]   # pin 113

[ports.slot_reset_n]
dir = "in"
balls = ["M1"]   # pin 119

[ports.slot_sync_n]
dir = "in"
balls = ["L1"]   # pin 115

[ports.slot_d_dir]
dir = "out"
balls = ["G13"]   # pin 78

[ports.slot_d_oe_n]
dir = "out"
balls = ["L14"]   # pin 60

[ports.slot_a_dir]
dir = "out"
balls = ["T2"]   # pin 135

[ports.slot_a_oe_n]
dir = "out"
balls = ["A8"]   # pin 41

[ports.slot_irq_n_o]
dir = "out"
balls = ["K4"]   # pin 154

[ports.slot_nmi_n_o]
dir = "out"
balls = ["K3"]   # pin 156

[ports.slot_inh_n_o]
dir = "out"
balls = ["H3"]   # pin 148

[ports.slot_dma_n_o]
dir = "out"
balls = ["R8"]   # pin 155

[ports.slot_rdy_o]
dir = "out"
balls = ["J3"]   # pin 152

[ports.slot_reset_n_o]
dir = "out"
balls = ["R7"]   # pin 153

[ports.safe_n]
dir = "in"
balls = ["E14"]   # pin 84

[ports.uart_rx]
dir = "in"
balls = ["F13"]   # pin 82

[ports.uart_tx]
dir = "out"
balls = ["F14"]   # pin 80
