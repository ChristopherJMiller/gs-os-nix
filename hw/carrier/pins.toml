#
# carrier_top's port -> ball assignment (rtl/board/carrier_top.v), for the LFE5U-25F on
# the iCESugar-Pro module. The LPF is generated from this file. hw-pinmap checks that every
# ball is a PIO in a 3.3 V bank, that each ball is on a SODIMM pin (hw/carrier/
# icesugar_pro_v1_3.toml), and that the netlist carries the port's net on that pin.
#
# The balls are chosen by hw/tools/assign_pins.py for the placement in hw/carrier/
# placement.toml: it moves each bit to the SODIMM contact that leaves the fewest ratsnest
# crossings on the 2-layer board, keeping every bus in bit order along the socket. Do not
# hand-edit; rerun `python3 hw/tools/assign_pins.py --write` after the placement changes.
# Every bank is 3.3 V (the module powers VCCIO from 3V3), so the bank does not constrain it.
#
# Every one of the slot-side bits is a slot signal, so there is no pin-end preference to
# honour: the socket's orientation against J1 is the placement task's choice.

part = "LFE5U-25F-6BG256C"
io_standard = "LVCMOS33"

[ports.clk25]
dir = "in"
on_module = true
balls = ["P6"]

[ports.slot_a]
dir = "in"
# SODIMM pins 71 75 77 85 89 92 93 94 101 112 114 116 120 124 126 128
balls = ["A3", "A2", "B1", "D1", "E1", "D13", "F1", "C12", "H2", "D9", "C8", "D8", "D7", "D6", "C5", "D5"]

[ports.slot_rw]
dir = "in"
balls = ["R4"]   # pin 141

[ports.slot_d]
dir = "inout"
# SODIMM pins 41 49 51 60 61 66 67 70
balls = ["A8", "B8", "A7", "L14", "B6", "K13", "A4", "J13"]

[ports.slot_dl]
dir = "in"
# SODIMM pins 42 44 46 48 50 52 58 64
balls = ["P11", "P12", "N12", "P13", "N13", "P14", "M13", "K14"]

[ports.slot_ph0]
dir = "in"
balls = ["M1"]   # pin 119

[ports.slot_ph1]
dir = "in"
balls = ["N1"]   # pin 123

[ports.slot_q3]
dir = "in"
balls = ["T2"]   # pin 135

[ports.slot_7m]
dir = "in"
balls = ["R3"]   # pin 137

[ports.slot_devsel_n]
dir = "in"
balls = ["M2"]   # pin 121

[ports.slot_iosel_n]
dir = "in"
balls = ["D4"]   # pin 132

[ports.slot_iostrb_n]
dir = "in"
balls = ["P2"]   # pin 129

[ports.slot_m2sel_n]
dir = "in"
balls = ["C3"]   # pin 134

[ports.slot_m2b0]
dir = "in"
balls = ["E3"]   # pin 138

[ports.slot_reset_n]
dir = "in"
balls = ["R1"]   # pin 131

[ports.slot_sync_n]
dir = "in"
balls = ["P1"]   # pin 127

[ports.slot_d_dir]
dir = "out"
balls = ["E13"]   # pin 86

[ports.slot_d_oe_n]
dir = "out"
balls = ["B2"]   # pin 79

[ports.slot_a_dir]
dir = "out"
balls = ["K1"]   # pin 111

[ports.slot_a_oe_n]
dir = "out"
balls = ["C4"]   # pin 130

[ports.slot_irq_n_o]
dir = "out"
balls = ["P7"]   # pin 151

[ports.slot_nmi_n_o]
dir = "out"
balls = ["K3"]   # pin 156

[ports.slot_inh_n_o]
dir = "out"
balls = ["T4"]   # pin 143

[ports.slot_dma_n_o]
dir = "out"
balls = ["H3"]   # pin 148

[ports.slot_rdy_o]
dir = "out"
balls = ["R5"]   # pin 145

[ports.slot_reset_n_o]
dir = "out"
balls = ["F3"]   # pin 142

[ports.safe_n]
dir = "in"
balls = ["H14"]   # pin 72

[ports.uart_rx]
dir = "in"
balls = ["F4"]   # pin 140

[ports.uart_tx]
dir = "out"
balls = ["J14"]   # pin 68
