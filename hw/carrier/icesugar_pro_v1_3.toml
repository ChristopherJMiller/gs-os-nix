# iCESugar-Pro v1.3: which module function or FPGA ball sits on each DDR2
# SODIMM-200 pin. Transcribed from the module schematic, symbol U2.
# Pins not listed (13-38, 43, 45, 47, 53, 159-198) are no-connect on the module.
# Each PIO label on U2 was resolved to a ball through the bank sheets
# (U1A-U1G) of the same schematic, then cross-checked against the Trellis
# database and the LiteX platform by hw/tests/test_icesugar_map.py.

[source]
repo = "https://github.com/wuxx/icesugar-pro"
commit = "087e48d9e0b0a0168ce165a961cba306335c4cf2"
schematic = "schematic/iCESugar-Pro-v1.3.pdf"
sha256 = "767cd3f1ac434a0c54d279bd41c885f86024656cf8da36d733530fb07a232b4a"
baseboard_map = "doc/iCESugar-pro-pinmap.png"

# Only 5V and GND appear on the connector. The module makes its own 3V3, 2V5
# and 1V1 (SY8008 U4/U7, XC6206 U6) from 5V; the schematic states no current limit.
[rails]
5V = [2, 4, 6, 8, 10, 12]
GND = [1, 3, 5, 7, 9, 11, 39, 40, 55, 56, 105, 106, 107, 108, 157, 158, 199, 200]

[rail_role]
5V = "input+usb"
GND = "return"

[notes]
5V = "Module 5V net is the SODIMM 5V pins AND the USB-C J4 VBUS pins, joined directly with no diode (sheet 1, USB block, F1 sits between this net and 5V_USB which feeds U4/U6/U7). The carrier must put a series diode in its +5V feed so it cannot back-feed a USB host."
jtag = "FPGA TCK/TMS/TDI/TDO (T10 T11 R11 M10) go only to the on-module iCELink MCU U8 and module header J1, not to the SODIMM. Program through the module's USB."
serial = "UART B9/A9 (PT42A/PT16A) go only to the on-module iCELink MCU, not to the SODIMM."
vccio = "Every VCCIO pin (banks 0 1 2 3 6 7 8) is tied to 3V3 on the SYS sheet; VCCAUX is 2V5, VCC is 1V1."

# bank_vccio: Trellis bank number -> VCCIO volts (LFE5U-25F has banks 0 1 2 3 6 7 8)
[bank_vccio]
0 = 3.3
1 = 3.3
2 = 3.3
3 = 3.3
6 = 3.3
7 = 3.3
8 = 3.3

