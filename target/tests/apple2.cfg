# ld65 config for a raw Apple II binary loaded at $2000.
#
# $2000 is the usual landing spot for a ProDOS 8 BLOAD/BRUN binary and is clear
# of the text page and the language card. The output is a headerless image, so
# whatever wraps it (a disk image, or a MAME debugger load) supplies the address.

MEMORY {
    ZP:   start = $0080, size = $0010, type = rw, define = yes;
    MAIN: start = $2000, size = $6000, file = %O, define = yes;
}

SEGMENTS {
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = MAIN, type = bss, define = yes;
}
