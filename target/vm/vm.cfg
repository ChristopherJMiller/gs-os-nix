# ld65 config for the VM (target/vm/vm.s), a raw binary loaded at $2000.
#
# MAIN is capped at 12 KB on purpose: the nursery begins at $5000 (see the memory
# map in vm.s), and a VM that grows into it corrupts its own tail -- the
# true/false singletons -- in a way that only shows up as a type error at some
# recursion depth. The linker refusing to produce the binary is the loud failure
# this project prefers.

MEMORY {
    ZP:   start = $0080, size = $0080, type = rw, define = yes;
    MAIN: start = $2000, size = $3000, file = %O, define = yes;
}

SEGMENTS {
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = MAIN, type = bss, define = yes;
}
